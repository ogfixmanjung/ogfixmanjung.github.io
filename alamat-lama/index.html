<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ogfix. – Alamat baru</title>
  <script>
    // Alamat lama -> alamat baru (kekalkan ?id=... dan #...)
    (function () {
      var NEW = 'https://ogfixmanjung.github.io';
      var path = location.pathname.replace(/^\/SYSTEM-TERIMA-DEVICE-OGFIX/i, '') || '/';
      location.replace(NEW + path + location.search + location.hash);
    })();
  </script>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f2f1ec; color: #18201b; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 16px; text-align: center; }
    a { color: #1e4a33; font-weight: 700; }
  </style>
</head>
<body>
  <p>ogfix. telah berpindah ke alamat baru.<br><a id="go" href="https://ogfixmanjung.github.io/">https://ogfixmanjung.github.io</a></p>
  <script>
    var p = location.pathname.replace(/^\/SYSTEM-TERIMA-DEVICE-OGFIX/i, '') || '/';
    document.getElementById('go').href = 'https://ogfixmanjung.github.io' + p + location.search + location.hash;
  </script>
</body>
</html>
